<script>
  // 背景自动探测（保持上一版逻辑）
  (function(){
    const candidates = [
      "../bg-wood-upload.jpg",
      "bg-wood-upload.jpg",
      "file:///android_asset/bg-wood-upload.jpg",
      "file:///android_asset/flutter_assets/assets/bg-wood-upload.jpg",
      "/android_asset/bg-wood-upload.jpg",
      "/android_asset/flutter_assets/assets/bg-wood-upload.jpg"
    ];
    function tryNext(i){
      if(i>=candidates.length) return;
      const url = candidates[i];
      const img = new Image();
      img.onload = ()=> document.documentElement.style.setProperty('--bg-url', `url('${url}')`);
      img.onerror = ()=> tryNext(i+1);
      img.src = url + (url.includes('?')?'':'?v=' + Date.now());
    }
    if(getComputedStyle(document.documentElement).getPropertyValue('--bg-url').includes("bg-wood-upload.jpg")){
      tryNext(0);
    }
  })();

  window.setBackground = function(url){
    document.documentElement.style.setProperty('--bg-url', `url('${url}')`);
  };
  window.setDynamicData = function(payload){
    if(payload.topic !== undefined){ document.getElementById('topic-text').textContent = payload.topic ?? ''; }
    if(payload.quote !== undefined){ document.getElementById('quote-text').textContent = payload.quote ?? ''; }
    if(payload.author !== undefined){ document.getElementById('author-text').textContent = payload.author ?? ''; }
    if(payload.note !== undefined){ document.getElementById('note-text').textContent = payload.note ?? ''; }
    /* AVATAR_TOGGLE_HOOK */
    if(payload.avatarUrl && String(payload.avatarUrl).trim() !== ''){
      const img = document.getElementById('avatar-img');
      img.src = payload.avatarUrl;
      const fx = (payload.focalX ?? 50); const fy = (payload.focalY ?? 50);
      img.style.objectPosition = fx + '% ' + fy + '%';
      img.style.display = 'block';
      try{ document.getElementById('avatar-div').style.display = 'block'; }catch(_){}
    } else {
      try{ document.getElementById('avatar-img').style.display = 'none'; }catch(_){}
      try{ document.getElementById('avatar-div').style.display = 'none'; }catch(_){}
    }
    if(payload.bgUrl){ window.setBackground(payload.bgUrl); }
  };
</script>
<script id="HIDE_VIEWPORT_COVER">
(function(){
  function hideCover(){var c=document.querySelector('.viewport-cover'); if(c){c.style.display='none';}}
  if(document.readyState==='complete'||document.readyState==='interactive'){ hideCover(); }
  else { window.addEventListener('DOMContentLoaded', hideCover, {once:true}); }
  // also hide after dynamic payload injection if template uses it
  window.__hideCover = hideCover;
})();
</script>
