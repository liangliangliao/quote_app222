name: quote_app
description: "\u540D\u4EBA\u540D\u8A00\u83B7\u53D6\u5668\uFF08\u672C\u5730\u539F\u578B\
  \ + \u5B9A\u65F6 + \u5386\u53F2 + \u901A\u77E5\uFF09"
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  # Camera access for PPG (heart-rate) measurement.
  camera: ^0.10.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  audioplayers: ^5.2.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^19.4.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  crypto: ^3.0.3
  image_picker: ^1.1.2
  # Camera barcode scanning for packaged food barcode lookup.
  mobile_scanner: ^5.2.3
  file_picker: ^8.0.3
  csv: ^6.0.0
  scrollable_positioned_list: ^0.3.8
  # epub_view 3.x depends on image 3.x through epubx; keep this constraint compatible.
  image: ^3.3.0
  # Excel package used for reading questionnaire templates from .xlsx files.
  excel: ^2.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_tts: ^4.2.2
  speech_to_text: ^7.3.0
  # Save images to system gallery (MediaStore on Android).
  # Request storage/photos permission on older Android versions when needed.
  permission_handler: ^11.3.1
  # OAuth (Fitbit) via custom tab / ASWebAuthenticationSession.
  # NOTE: Flutter 3.29+ removed the old Android v1 embedding API (PluginRegistry.Registrar).
  # flutter_web_auth_2 4.x removes v1 embedding usage and restores Android builds on newer Flutter.
  flutter_web_auth_2: ^4.1.0
  # Visualize hierarchical relations (mindmap / tree) for thought taxonomy.
  # GraphView provides tree/mindmap layout algorithms and InteractiveViewer integration.
  graphview: ^1.5.1
  archive: ^3.6.1
  xml: ^6.5.0
  epub_view: ^3.2.0
  # Open third-party movie search pages in the user's external browser.
  url_launcher: ^6.2.6
  # Official YouTube embedded playback inside the app.
  webview_flutter: ^4.8.0
  # Open/licensed audio playback uses the existing audioplayers dependency.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/html/poster-wall-only-frame-v23-1.html
    - assets/fallback/camus_fallback.json
    # 新增背景图片用于海报页面背景
    - assets/bg-wood-upload.jpg
    - assets/home_small_frame.png
    - assets/todo_bg/
    # Explicitly enumerate avatar assets to avoid stale/invalid filenames in reused CI workspaces.
    - assets/avatars/talbenshahar .jpeg
    - assets/avatars/Albert_Camus_1945_(cropped).jpg
    - assets/avatars/Friedrich Nietzsche.jpg
    - assets/avatars/250px-William_James_b1842c.jpg
    - assets/avatars/Immanuel Kant.jpg
    - assets/avatars/schopenhauer.jpg
    - assets/avatars/wangyangming.jpeg
    - assets/avatars/eckhart tolle.jpg
    - assets/avatars/avatar_legacy_01.jpg
    - assets/avatars/README.txt
    - assets/failure_module/seed_failure_perfection.json
    - assets/will/ch26_simplified_full.txt
    - assets/yangming_module/mission_state_machines.json
    - assets/yangming_module/zhixing15_content.txt
    - assets/yangming_module/lizhi12_content.txt
    - assets/zhixing_tree/knowledge_manifest_v2_0.json
    - assets/zhixing_tree/knowledge_systems_v2_0.json
    - assets/zhixing_tree/knowledge_v2_0.md
