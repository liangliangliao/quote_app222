name: Meditation Mentor CI

on:
  pull_request:
    paths:
      - 'lib/meditation_module/**'
      - 'lib/services/global_ai_settings.dart'
      - 'test/meditation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meditation-mentor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mentor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Provide SQLite for diagnostic logging tests
        run: |
          mentor_sqlite_dir="$RUNNER_TEMP/meditation-sqlite"
          mkdir -p "$mentor_sqlite_dir"
          ln -s /lib/x86_64-linux-gnu/libsqlite3.so.0 "$mentor_sqlite_dir/libsqlite3.so"
          echo "LD_LIBRARY_PATH=$mentor_sqlite_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Analyze meditation generation and playback
        run: >-
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
          lib/meditation_module test/meditation
      - name: Test topic guidance, repair and speech pauses
        run: flutter test --no-pub test/meditation
