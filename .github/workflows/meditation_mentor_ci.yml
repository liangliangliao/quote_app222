name: Meditation Mentor CI

on:
  pull_request:
    paths:
      - 'lib/meditation_module/**'
      - 'lib/services/global_ai_settings.dart'
      - 'test/meditation/**'
      - '.github/workflows/meditation_mentor_ci.yml'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meditation-mentor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mentor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze meditation generation and playback
        run: >-
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
          lib/meditation_module lib/services/global_ai_settings.dart test/meditation
      - name: Test topic guidance, repair and speech pauses
        run: flutter test --no-pub test/meditation
