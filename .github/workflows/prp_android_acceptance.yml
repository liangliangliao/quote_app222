name: PRP Android Acceptance
on:
  workflow_dispatch:
  push:
    branches: ['feature/prp-plugin']
    paths:
      - 'lib/prp_plugin/**'
      - 'lib/prp_plugin_host/**'
      - 'lib/failure_module/**'
      - 'android/**'
      - 'integration_test/prp_acceptance_test.dart'
      - 'test_driver/prp_acceptance_driver.dart'
      - 'tool/prp_acceptance.sh'
      - 'pubspec.*'
      - '.github/workflows/prp_android_acceptance.yml'
permissions:
  contents: read
concurrency:
  group: prp-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: prp-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
      - name: Build the real app with the device acceptance entrypoint
        run: >-
          flutter build apk --debug --target-platform android-x64
          --target integration_test/prp_acceptance_test.dart
          --dart-define=PRP_ACCEPTANCE=true
          --dart-define=APP_SOURCE_SHA=${{ github.sha }}
          --dart-define=APP_SOURCE_REF=${{ github.ref_name }}
      # A Gradle-only task may rebuild the regular Dart entrypoint as a dependency.
      - name: Preserve the integration entrypoint APK
        run: |
          mkdir -p build/prp/acceptance
          cp build/app/outputs/flutter-apk/app-debug.apk build/prp/acceptance/
      - name: Compile isolated native-only instrumentation APK
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest
      - name: Collect test APKs
        run: |
          mkdir -p build/prp/acceptance
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/prp/acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: prp-device-test-apks
          path: build/prp/acceptance/
  android-device:
    needs: compile-device-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: prp-device-test-apks
          path: build/prp/acceptance/
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          PRP_API_LEVEL: ${{ matrix.api }}
          PRP_SOURCE_SHA: ${{ github.sha }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash tool/prp_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prp-android-api-${{ matrix.api }}-evidence
          path: build/prp/device-evidence/
