name: Zhixing Tree CI

on:
  pull_request:
    paths:
      - "lib/zhixing_tree/**"
      - "lib/pages/discover_page.dart"
      - "test/zhixing_tree/**"
      - "docs/zhixing_tree/**"
      - ".github/workflows/zhixing_tree_ci.yml"
  workflow_dispatch:

concurrency:
  group: zhixing-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze subsystem
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/zhixing_tree

      - name: Analyze discovery integration
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/discover_page.dart

      - name: Run subsystem tests
        run: flutter test test/zhixing_tree

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
