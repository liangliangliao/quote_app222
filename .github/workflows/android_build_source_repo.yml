name: Build Android APK (Manual)
run-name: APK · manual · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      self_os_checks:
        description: 'Run only Self OS analysis and tests before building the APK'
        type: boolean
        required: false
        default: false
# APKs are intentionally NOT built for push / pull_request events.
# Feature-specific CI workflows run on PRs; choose the branch in Actions -> Run workflow.
permissions:
  contents: read

concurrency:
  group: apk-manual-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One explicit manual build on the selected branch; no automatic PR/push builds.
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          printf '### 手动 APK 构建版本\\n\\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Branch: \`%s\`\\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Commit SHA: \`%s\`\\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Sanity check - list repo root
        shell: bash
        run: |
          pwd
          ls -lah

      - name: Detect project type and root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # 现在仓库已经不再依赖源码 zip，直接从仓库中的真实源码构建。
          # Prefer repo root when it is a Flutter app root.
          FLUTTER_DIR=""
          if [[ -f "pubspec.yaml" && -f "lib/main.dart" ]]; then
            FLUTTER_DIR="."
          else
            while IFS= read -r d; do
              if [[ -f "$d/lib/main.dart" ]]; then
                FLUTTER_DIR="$d"
                break
              fi
            done < <(find . -maxdepth 4 -type f -name pubspec.yaml -printf '%h\n' | sort -u)
          fi

          GRADLE_DIR=""
          if [[ -z "$FLUTTER_DIR" ]]; then
            if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
              GRADLE_DIR="."
            else
              GRADLE_DIR="$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort -u | head -n 1 || true)"
            fi
          fi

          if [[ -n "$FLUTTER_DIR" ]]; then
            echo "project_type=flutter" >> "$GITHUB_OUTPUT"
            echo "project_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected Flutter project: $FLUTTER_DIR"
            ls -la "$FLUTTER_DIR"
            test -f "$FLUTTER_DIR/pubspec.yaml"
            test -f "$FLUTTER_DIR/lib/main.dart"
          elif [[ -n "$GRADLE_DIR" ]]; then
            echo "project_type=gradle" >> "$GITHUB_OUTPUT"
            echo "project_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected Android Gradle project: $GRADLE_DIR"
            ls -la "$GRADLE_DIR"
          else
            echo "❌ 未检测到 Flutter 或 Android Gradle 工程。请确认仓库中存在 pubspec.yaml + lib/main.dart，或 settings.gradle/settings.gradle.kts。"
            exit 1
          fi

      # ---------- Flutter path preferred ----------
      - name: Set up JDK 17
        if: steps.detect.outputs.project_type == 'flutter' || steps.detect.outputs.project_type == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.detect.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter pub get

      # Opt-in Self OS validation for a manual build; PR module tests remain separate.
      - name: Prepare SQLite for Self OS tests
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Analyze Self OS only
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter analyze --no-pub lib/self_os test/self_os

      - name: Test Self OS only
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter test --no-pub test/self_os --reporter expanded

      - name: Preload Gradle wrapper with retries
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle wrapper download attempt ${attempt}/3"
            if ./android/gradlew --version; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Gradle wrapper could not be downloaded after 3 attempts."
          exit 1

      - name: Ensure Android platform exists
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name quote_app --org com.example
          fi

      - name: Sanity check - project root
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          echo "PWD=$(pwd)"
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Build APK - Flutter release
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter build apk --release -t lib/main.dart

      - name: Record Flutter APK version and SHA-256
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sha256sum "$apk" > build/app/outputs/flutter-apk/app-release.sha256
          {
            printf 'branch=%s\\n' "$GITHUB_REF_NAME"
            printf 'commit_sha=%s\\n' "$GITHUB_SHA"
            printf 'run_url=%s/%s/actions/runs/%s\\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'apk_sha256=%s\\n' "$(sha256sum "$apk" | cut -d ' ' -f 1)"
          } > build/app/outputs/flutter-apk/build-info.txt
          {
            printf '### APK 文件验证\\n'
            cat build/app/outputs/flutter-apk/build-info.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK - Flutter
        if: steps.detect.outputs.project_type == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: quote_app-apk
          path: |
            ${{ steps.detect.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.detect.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.sha256
            ${{ steps.detect.outputs.project_dir }}/build/app/outputs/flutter-apk/build-info.txt
          if-no-files-found: error

      # ---------- Gradle path fallback ----------
      - name: Set up Gradle 8.7
        if: steps.detect.outputs.project_type == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Assemble debug with Gradle
        if: steps.detect.outputs.project_type == 'gradle'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK - Gradle
        if: steps.detect.outputs.project_type == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            ${{ steps.detect.outputs.project_dir }}/**/outputs/apk/**/*.apk
