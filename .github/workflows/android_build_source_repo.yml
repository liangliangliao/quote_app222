name: Build Android APK
run-name: Build Android APK · ${{ inputs.self_os_checks && 'Self OS V3.7 · ' || '' }}${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      self_os_checks:
        description: 'Run only Self OS analysis and tests before building the APK'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - ".github/workflows/android_build_source_repo.yml"
      - "lib/**"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "test/**"
      - "tools/zhixing_tree/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "**/*.dart"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/*.xml"
      - "**/*.kt"
      - "**/*.java"
  pull_request:
    paths:
      - ".github/workflows/android_build_source_repo.yml"
      - "lib/**"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "test/**"
      - "tools/zhixing_tree/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "**/*.dart"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/*.xml"
      - "**/*.kt"
      - "**/*.java"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.changes.outputs.run_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check the latest pushed range
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" != "synchronize" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git ls-tree -r --name-only "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/android_build_source_repo\.yml$|lib/|android/|ios/|assets/|test/|tools/zhixing_tree/|pubspec\.yaml$|pubspec\.lock$|analysis_options\.yaml$|gradle/|gradlew$|settings\.gradle(\.kts)?$|build\.gradle(\.kts)?$|.*\.(dart|gradle|xml|kt|java)$)'; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            echo "Latest pushed range only changes CI or documentation; APK build is skipped."
          fi

  build:
    needs: scope
    # The dedicated delivery workflow handles branch pushes; PRs still need
    # this workflow so the APK build check is not skipped on the review commit.
    if: needs.scope.outputs.run_build == 'true' && (github.event_name == 'pull_request' || (github.ref != 'refs/heads/codex/growth-six-core-features' && github.head_ref != 'codex/growth-six-core-features' && github.ref != 'refs/heads/codex/growth-v27-journeys' && github.head_ref != 'codex/growth-v27-journeys'))
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check - list repo root
        shell: bash
        run: |
          pwd
          ls -lah

      - name: Detect project type and root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # 现在仓库已经不再依赖源码 zip，直接从仓库中的真实源码构建。
          # Prefer repo root when it is a Flutter app root.
          FLUTTER_DIR=""
          if [[ -f "pubspec.yaml" && -f "lib/main.dart" ]]; then
            FLUTTER_DIR="."
          else
            while IFS= read -r d; do
              if [[ -f "$d/lib/main.dart" ]]; then
                FLUTTER_DIR="$d"
                break
              fi
            done < <(find . -maxdepth 4 -type f -name pubspec.yaml -printf '%h\n' | sort -u)
          fi

          GRADLE_DIR=""
          if [[ -z "$FLUTTER_DIR" ]]; then
            if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
              GRADLE_DIR="."
            else
              GRADLE_DIR="$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort -u | head -n 1 || true)"
            fi
          fi

          if [[ -n "$FLUTTER_DIR" ]]; then
            echo "project_type=flutter" >> "$GITHUB_OUTPUT"
            echo "project_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected Flutter project: $FLUTTER_DIR"
            ls -la "$FLUTTER_DIR"
            test -f "$FLUTTER_DIR/pubspec.yaml"
            test -f "$FLUTTER_DIR/lib/main.dart"
          elif [[ -n "$GRADLE_DIR" ]]; then
            echo "project_type=gradle" >> "$GITHUB_OUTPUT"
            echo "project_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected Android Gradle project: $GRADLE_DIR"
            ls -la "$GRADLE_DIR"
          else
            echo "❌ 未检测到 Flutter 或 Android Gradle 工程。请确认仓库中存在 pubspec.yaml + lib/main.dart，或 settings.gradle/settings.gradle.kts。"
            exit 1
          fi

      # ---------- Flutter path preferred ----------
      - name: Set up JDK 17
        if: steps.detect.outputs.project_type == 'flutter' || steps.detect.outputs.project_type == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.detect.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter pub get

      # Automatic APK delivery remains compile-only. A manual dispatch may
      # explicitly request Self OS checks without running other module suites.
      - name: Prepare SQLite for Self OS tests
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Analyze Self OS only
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter analyze --no-pub lib/self_os test/self_os

      - name: Test Self OS only
        if: steps.detect.outputs.project_type == 'flutter' && inputs.self_os_checks == true
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter test --no-pub test/self_os --reporter expanded

      - name: Preload Gradle wrapper with retries
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle wrapper download attempt ${attempt}/3"
            if ./android/gradlew --version; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Gradle wrapper could not be downloaded after 3 attempts."
          exit 1

      - name: Ensure Android platform exists
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name quote_app --org com.example
          fi

      - name: Sanity check - project root
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          echo "PWD=$(pwd)"
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Build APK - Flutter release
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: flutter build apk --release --build-name 0.1.3 --build-number 7 -t lib/main.dart

      - name: Package APK with source identity
        id: apk_package
        if: steps.detect.outputs.project_type == 'flutter'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          package_name="quote-app-${SOURCE_SHA:0:12}-run${GITHUB_RUN_NUMBER}"
          mkdir -p build/apk-delivery
          cp build/app/outputs/flutter-apk/app-release.apk "build/apk-delivery/${package_name}.apk"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg build_sha "$(git rev-parse HEAD)" \
            --arg ref "$SOURCE_REF" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{source_sha: $source_sha, build_sha: $build_sha, ref: $ref, run_url: $run_url}' \
            > build/apk-delivery/build-info.json
          (cd build/apk-delivery && sha256sum "${package_name}.apk" > SHA256SUMS)
          cp docs/quote_epistemic_p0_implementation.md build/apk-delivery/READING-AND-COMPARISON.md
          cp docs/cognitive_prototypes_2_10.md build/apk-delivery/COGNITIVE-MODES.md
          cp docs/cognitive_prototypes_2_10.md build/apk-delivery/cognitive_prototypes_2_10.md
          cp docs/cognitive_requirements_audit_2026_11_01.md build/apk-delivery/cognitive_requirements_audit_2026_11_01.md
          cp docs/schopenhauer_plan_full_acceptance.md build/apk-delivery/schopenhauer_plan_full_acceptance.md
          cp docs/cognitive_prototype_depth_v3.md build/apk-delivery/COGNITIVE-PROTOTYPE-V3.md
          echo 'New style is opt-in: 设置 → 阅读与认知风格 → 叔本华认知风格. Home artwork remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "APK source: $SOURCE_REF / $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK - Flutter
        if: steps.detect.outputs.project_type == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_package.outputs.name }}
          path: ${{ steps.detect.outputs.project_dir }}/build/apk-delivery/
          if-no-files-found: error

      # ---------- Gradle path fallback ----------
      - name: Set up Gradle 8.7
        if: steps.detect.outputs.project_type == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Assemble debug with Gradle
        if: steps.detect.outputs.project_type == 'gradle'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK - Gradle
        if: steps.detect.outputs.project_type == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            ${{ steps.detect.outputs.project_dir }}/**/outputs/apk/**/*.apk
