name: Semantic Quote Frame CI

on:
  pull_request:
    paths:
      - 'lib/pages/home_page.dart'
      - 'lib/widgets/poster_pure_flutter.dart'
      - 'lib/widgets/quote_adaptive_frame.dart'
      - 'lib/widgets/quote_portrait_cutout.dart'
      - 'lib/services/quote_portrait_matte.dart'
      - 'lib/services/quote_frame_theme.dart'
      - 'lib/services/quote_frame_ai_service.dart'
      - 'lib/services/quote_visual_script_service.dart'
      - 'assets/bg-wood-upload.jpg'
      - 'assets/bg-white-gallery.png'
      - 'test/quote_frame_theme_test.dart'
      - 'test/quote_visual_script_test.dart'
      - 'test/quote_paper_layout_test.dart'
      - 'test/quote_portrait_matte_test.dart'
      - '.github/workflows/quote_frame_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_any: ${{ steps.changes.outputs.run_any }}
      run_layout: ${{ steps.changes.outputs.run_layout }}
      run_matte: ${{ steps.changes.outputs.run_matte }}
      run_semantic: ${{ steps.changes.outputs.run_semantic }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select tests for the latest pushed range
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed_files=".github/workflows/quote_frame_ci.yml"
          elif [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$BEFORE_SHA" ] && [ -n "$AFTER_SHA" ]; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          printf '%s\n' "$changed_files"
          run_layout=false
          run_matte=false
          run_semantic=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(lib/pages/home_page\.dart$|lib/widgets/(poster_pure_flutter|quote_adaptive_frame|quote_portrait_cutout)\.dart$|assets/(bg-wood-upload\.jpg|bg-white-gallery\.png)$|test/quote_paper_layout_test\.dart$)'; then
            run_layout=true
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(lib/services/quote_portrait_matte\.dart$|test/quote_portrait_matte_test\.dart$)'; then
            run_matte=true
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(lib/services/(quote_frame_theme|quote_frame_ai_service|quote_visual_script_service)\.dart$|test/(quote_frame_theme|quote_visual_script)_test\.dart$)'; then
            run_semantic=true
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^\.github/workflows/quote_frame_ci\.yml$'; then
            run_layout=true
            run_matte=true
            run_semantic=true
          fi

          run_any=false
          if [ "$run_layout" = true ] || [ "$run_matte" = true ] || [ "$run_semantic" = true ]; then
            run_any=true
          fi
          echo "run_any=$run_any" >> "$GITHUB_OUTPUT"
          echo "run_layout=$run_layout" >> "$GITHUB_OUTPUT"
          echo "run_matte=$run_matte" >> "$GITHUB_OUTPUT"
          echo "run_semantic=$run_semantic" >> "$GITHUB_OUTPUT"

  verify:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip unrelated quote-frame tests
        if: needs.scope.outputs.run_any != 'true'
        run: echo "Latest pushed range does not change the quote frame; 26 unrelated tests are skipped."
      - uses: actions/checkout@v4
        if: needs.scope.outputs.run_any == 'true'
      - uses: subosito/flutter-action@v2
        if: needs.scope.outputs.run_any == 'true'
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        if: needs.scope.outputs.run_any == 'true'
        run: flutter pub get
      - name: Prepare Chinese font for visual verification
        if: needs.scope.outputs.run_layout == 'true'
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          -o /tmp/quote-preview-cjk.otf
      - name: Analyze quote-frame layout
        if: needs.scope.outputs.run_layout == 'true'
        run: >-
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
          lib/widgets/quote_adaptive_frame.dart
          lib/widgets/quote_portrait_cutout.dart
          lib/widgets/poster_pure_flutter.dart
          lib/pages/home_page.dart
          test/quote_paper_layout_test.dart
      - name: Test quote-frame layout
        if: needs.scope.outputs.run_layout == 'true'
        run: flutter test --no-pub --reporter expanded test/quote_paper_layout_test.dart
      - name: Analyze portrait matte
        if: needs.scope.outputs.run_matte == 'true'
        run: >-
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
          lib/services/quote_portrait_matte.dart test/quote_portrait_matte_test.dart
      - name: Test portrait matte
        if: needs.scope.outputs.run_matte == 'true'
        run: flutter test --no-pub --reporter expanded test/quote_portrait_matte_test.dart
      - name: Analyze semantic frame services
        if: needs.scope.outputs.run_semantic == 'true'
        run: >-
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
          lib/services/quote_frame_theme.dart
          lib/services/quote_frame_ai_service.dart
          lib/services/quote_visual_script_service.dart
          test/quote_frame_theme_test.dart test/quote_visual_script_test.dart
      - name: Test semantic frame services
        if: needs.scope.outputs.run_semantic == 'true'
        run: >-
          flutter test --no-pub --reporter expanded
          test/quote_frame_theme_test.dart test/quote_visual_script_test.dart
      - name: Upload actual quote render
        if: ${{ always() && needs.scope.outputs.run_layout == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: quote-fixed-portrait-build7-preview
          path: build/quote-frame-preview/
          if-no-files-found: ignore
