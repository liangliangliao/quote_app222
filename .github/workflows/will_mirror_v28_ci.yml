name: Will Mirror v2.8
on:
  pull_request:
    paths:
      - 'lib/will_mirror/**'
      - 'lib/pages/discover_page.dart'
      - 'lib/services/notification_service.dart'
      - 'android/app/src/main/kotlin/com/example/quote_app/WillMirrorV28Vault.kt'
      - 'test/will_mirror/**'
      - 'integration_test/will_mirror_storage_test.dart'
      - 'test_driver/will_mirror_storage_driver.dart'
      - 'tools/will_mirror/**'
      - 'server/will_mirror/**'
      - 'docs/will_mirror/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/will_mirror_v28_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: will-mirror-v28-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev fonts-noto-cjk
      - run: flutter pub get
      - run: flutter analyze --no-pub lib/will_mirror test/will_mirror integration_test/will_mirror_storage_test.dart test_driver/will_mirror_storage_driver.dart
      - run: flutter test --no-pub --reporter expanded test/will_mirror
      - run: pip install -r server/will_mirror/requirements.txt
      - run: pytest -q server/will_mirror/test_contract.py
      - run: python3 docs/will_mirror/check_acceptance.py
  android-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android SQLite and Keystore, including APK replacement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/will_mirror/android_storage_probe.sh emulator-5554
