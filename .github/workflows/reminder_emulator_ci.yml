name: Reminder Android background probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reminder_emulator_ci.yml'
      - 'android/app/src/androidTest/**'
      - 'tool/reminder_emulator_probe.sh'
permissions:
  contents: read
concurrency:
  group: reminder-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  android-background:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug -t lib/main.dart
      - name: Build isolated instrumentation APK
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify killed-process and reboot delivery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tool/reminder_emulator_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-emulator-results
          path: probe-*.txt
