import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.quote_app"
    // Keep aligned with android/gradle.properties (android.compileSdkVersion).
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.example.quote_app"
        // Health Connect connect-client:1.1.0 requires API 26+.
        // Keeping it below 26 causes manifest merge failure during release builds.
        minSdk = 26
        // Keep aligned with CI-installed Android SDK platforms.
        targetSdk = 33
        versionCode 13
        versionName "1.0"
        multiDexEnabled true
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}


configurations.configureEach {
    // WorkManager and some AndroidX libraries reference ListenableFuture.
    // Do not keep the standalone listenablefuture artifact on the classpath: Gradle may
    // resolve it to the empty 9999.0 placeholder, which leaves javac without the class.
    // The full Guava Android artifact below provides com.google.common.util.concurrent.ListenableFuture.
    exclude group: "com.google.guava", module: "listenablefuture"

    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.android.tools" && details.requested.name == "desugar_jdk_libs") {
            details.useVersion "2.1.4"
            details.because("flutter_local_notifications >=19 requires desugar_jdk_libs 2.1.4+")
        }
    }
}

dependencies {
    implementation "com.baidu.lbsyun:BaiduMapSDK_Location:9.6.6.1"
    implementation "com.baidu.lbsyun:BaiduMapSDK_Search:7.6.6"
    // Baidu SDK (Location/Search/Map init) requires OkHttp at runtime on some code paths.
    // Missing this will crash the :remote process with NoClassDefFoundError(OkHttpClient$Builder).
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // WorkManager's Java API references com.google.common.util.concurrent.ListenableFuture.
    // Use full Guava Android instead of the standalone listenablefuture artifact, because
    // Gradle can select com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava,
    // which contains no classes and causes release javac to fail.
    implementation "com.google.guava:guava:32.1.3-android"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    // Health Connect: read user-authorized steps, sleep, exercise, active calories and weight for diet context.
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.google.android.play:core:1.10.3"
    implementation "com.google.android.gms:play-services-location:21.0.1"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.24') {
            because 'Avoid duplicate classes with jdk7/jdk8 artifacts'
        }
    }
}