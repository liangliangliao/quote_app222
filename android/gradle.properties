org.gradle.jvmargs=-Xmx4096m -Dkotlin.daemon.jvm.options=-Xmx1536m
android.useAndroidX=true
android.enableJetifier=true
# Avoid auto-adding default Kotlin stdlib to reduce duplicates
kotlin.stdlib.default.dependency=false
org.gradle.vfs.watch=false
kotlin.jvm.target=17
# Keep SDK levels aligned with CI and widely available Android SDK platforms.
# CI currently installs Android SDK Platform 33, so using 33 avoids build failures.
android.compileSdkVersion=33
